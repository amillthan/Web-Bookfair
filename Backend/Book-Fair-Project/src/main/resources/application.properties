spring.application.name=Book-Fair-Project

# Server Port
server.port=8088

# ===== HTTPS/SSL CONFIGURATION (OWASP A02: Cryptographic Failures) =====
# Enable HTTPS and disable HTTP
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE_PATH:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_KEY_ALIAS:tomcat}
server.http2.enabled=true

# Secure Cookie Configuration
server.servlet.session.cookie.secure=${SSL_ENABLED:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Security Headers (OWASP A05: Security Misconfiguration)
server.servlet.session.tracking-modes=cookie

# Database Configuration (supports environment variables with local fallback)
spring.datasource.url=${DATABASE_CONNECTION_STRING:jdbc:mysql://localhost:3306/Bookfairpro?createDatabaseIfNotExist=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Prevent holding DB connection open across the full HTTP request lifecycle (OWASP A04)
spring.jpa.open-in-view=false

# ===== OIDC OAuth2 Resource Server Configuration — Asgardeo =====
# Asgardeo issuer URI format: https://api.asgardeo.io/t/<org-name>/oauth2/token
# Spring Boot auto-discovers JWKS endpoint from: {issuer-uri}/.well-known/openid-configuration
# Set OIDC_AUTHORITY env var in production. Example:
#   OIDC_AUTHORITY=https://api.asgardeo.io/t/bookfairorg/oauth2/token
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_AUTHORITY:https://api.asgardeo.io/t/bookfairorg/oauth2/token}
app.oidc.audience=${OIDC_AUDIENCE:https://api.bookfair.com}

# CORS & Application URLs
app.frontend.origin=${FRONTEND_URL:http://localhost:5173}

# ===== Logging Configuration (Prevent sensitive data exposure - OWASP A09) =====
# Production: WARN only; Development: INFO for troubleshooting
logging.level.root=WARN
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security.oauth2=INFO
logging.level.com.example.Book_Fair_Project=INFO

# Prevent SQL logging in production
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN

# File-based logging for audit trail and OWASP A09 evidence
logging.file.name=${LOG_FILE_PATH:logs/bookfair.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# Structured logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Centralized error handling
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ===== Rate Limiting Configuration (OWASP A04: Insecure Design) =====
# Enabled by default — set RATE_LIMITING_ENABLED=false to disable in local dev
app.rate-limiting.enabled=${RATE_LIMITING_ENABLED:true}
app.rate-limiting.requests-per-minute=${RATE_LIMIT_RPM:100}
# Trusted reverse proxy IP — only trust X-Forwarded-For from this IP (prevent spoofing)
app.trusted-proxy-ip=${TRUSTED_PROXY_IP:}
